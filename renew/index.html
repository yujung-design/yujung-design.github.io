<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이유정 포트폴리오</title>
    <!-- Google Fonts: 가독성 좋은 필기체 및 고딕체 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Montserrat:ital,wght@0,300;0,400;1,300&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 흑백 전환 버튼 -->
    <button id="theme-toggle" aria-label="흑백 전환">흑백전환</button>

    <div class="container">
        <!-- 상단 숫자 영역 -->
        <header id="top-header">
            <nav class="number-nav">
                <a href="#1" class="num-item">①</a>
                <a href="#2" class="num-item">②</a>
                <a href="#3" class="num-item">③</a>
                <a href="#4" class="num-item">④</a>
            </nav>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="main-content">
            <!-- 2. WEB 영역 (화면 크기에 비례하여 크기 조절) -->
            <section class="web-section">
                <div class="web-box">
                    <span>WEB</span>
                </div>
            </section>

            <!-- 우측 그룹 (XD, Gemini 및 before/QR) -->
            <div class="right-group">
                <!-- 3. XD와 Gemini (테두리 없는 리스트) -->
                <section class="tools-section">
                    <ul class="tools-list">
                        <li>XD</li>
                        <li>Gemini</li>
                    </ul>
                </section>

                <!-- 4. before 및 QR코드 영역 -->
                <section class="qr-section">
                    <span class="before-text">before</span>
                    <div class="qr-box">
                        <div class="qr-placeholder">QR</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 우측 하단 헤더 이동 화살표 버튼 -->
    <a href="#top-header" id="scroll-top-btn" aria-label="맨 위로 이동">↑</a>

    <script src="script.js"></script>
</body>
</html>
