<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels.com Mobile App UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* 통통 튀는 바운스 및 애니메이션 효과 */
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-soft {
            animation: bounceSoft 2s ease-in-out infinite;
        }
        .scale-hover {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .scale-hover:hover {
            transform: scale(1.02);
        }
        .scale-hover:active {
            transform: scale(0.98);
        }
        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:py-6">

    <!-- 아이폰 목업 프레임 래퍼 -->
    <div id="app-container" class="w-full sm:max-w-[400px] bg-white sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[840px] relative border-4 border-slate-800">
        
        <!-- 상단 다이내믹 아일랜드 / 노치 및 상태바 -->
        <div class="bg-white px-6 pt-3 pb-1 flex justify-between items-center text-xs font-semibold text-slate-800 z-30 shrink-0 select-none">
            <span>9:41</span>
            <div class="w-24 h-4 bg-slate-900 rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center space-x-1.5 text-[10px]">
                <span>5G</span>
                <div class="w-5 h-2.5 bg-slate-800 rounded-sm relative"></div>
            </div>
        </div>

        <!-- 메인 동적 페이지 뷰어 영역 -->
        <div id="page-content" class="flex-1 overflow-y-auto no-scrollbar relative bg-white pb-24">
            <!-- 자바스크립트에 의해 페이지가 렌더링됩니다 -->
        </div>

        <!-- 하단 네비게이션 바 (전체 페이지 공통 고정) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-100 px-6 py-3.5 flex justify-between items-center z-30 shadow-lg">
            <button onclick="switchPage('search-input')" class="nav-btn text-slate-400 hover:text-rose-500 transition-colors flex flex-col items-center group" data-page="search-input">
                <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <button onclick="switchPage('wishlist')" class="nav-btn text-slate-400 hover:text-rose-500 transition-colors flex flex-col items-center group" data-page="wishlist">
                <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
            <button onclick="switchPage('home')" class="nav-btn text-rose-500 flex flex-col items-center group" data-page="home">
                <div class="p-1 rounded-full bg-rose-50 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </div>
            </button>
            <button onclick="switchPage('discount')" class="nav-btn text-slate-400 hover:text-rose-500 transition-colors flex flex-col items-center group" data-page="discount">
                <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
            </button>
            <button onclick="switchPage('account')" class="nav-btn text-slate-400 hover:text-rose-500 transition-colors flex flex-col items-center group" data-page="account">
                <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
        </nav>
    </div>

    <script>
        // 전역 상태 관리 및 8개 페이지 데이터베이스
        let currentPage = 'home';
        
        // 위시리스트 상태 관리 (id별 찜 여부)
        const wishlistState = {
            1: true,
            2: true,
            3: true,
            4: false
        };

        const hotelData = [
            { id: 1, title: "시라카와 해변", location: "일본", price: "106,000 원", date: "12월 2일 ~ 6일", rating: "4.6", img: "https://images.unsplash.com/photo-1517760444937-f6397edcbbcd?auto=format&fit=crop&w=800&q=80" },
            { id: 2, title: "시라카와 목조 주택", location: "일본", price: "106,000 원", date: "12월 2일 ~ 6일", rating: "4.6", img: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=800&q=80" },
            { id: 3, title: "시라카와 리비에르 뒤 호텔", location: "일본", price: "106,000 원", date: "12월 2일 ~ 6일", rating: "4.6", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" },
            { id: 4, title: "시라카와 오두막", location: "일본", price: "98,000 원", date: "12월 2일 ~ 6일", rating: "4.8", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" }
        ];

        function toggleWishlist(event, id) {
            event.stopPropagation();
            wishlistState[id] = !wishlistState[id];
            
            // 만약 현재 위시리스트 페이지에 있다면 DOM을 즉시 리렌더링하여 부드럽게 카드 제거
            if (currentPage === 'wishlist') {
                switchPage('wishlist');
            } else {
                // 다른 페이지라면 알림 혹은 토스트 피드백
                const isLiked = wishlistState[id];
                showToast(isLiked ? '위시리스트에 추가되었습니다! ❤️' : '위시리스트에서 제외되었습니다.');
            }
        }

        function showToast(msg) {
            const existing = document.getElementById('toast-popup');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-popup';
            toast.className = 'absolute top-12 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 animate-fadeIn';
            toast.innerText = msg;
            document.getElementById('app-container').appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2000);
        }

        function switchPage(pageId, param = null) {
            currentPage = pageId;
            const container = document.getElementById('page-content');
            container.innerHTML = getPageHTML(pageId, param);
            container.scrollTop = 0;

            // 하단 내비게이션 바 아이콘 활성화 색상 업데이트
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === pageId) {
                    btn.classList.add('text-rose-500');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-rose-500');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        function getPageHTML(pageId, param) {
            switch(pageId) {
                case 'home':
                    return `
                        <!-- 1. Home 페이지 -->
                        <div class="p-4 space-y-4 animate-fadeIn">
                            <div class="flex flex-wrap gap-2 text-xs font-medium text-slate-600 justify-center pb-2">
                                <span class="bg-slate-50 px-3 py-1 rounded-full border border-slate-200"># 부산</span>
                                <span class="bg-slate-50 px-3 py-1 rounded-full border border-slate-200"># 꽃구경자</span>
                                <span class="bg-slate-50 px-3 py-1 rounded-full border border-slate-200"># 차박</span>
                                <span class="bg-slate-50 px-3 py-1 rounded-full border border-slate-200"># 캠핑</span>
                            </div>

                            <div class="mb-2">
                                <h1 class="text-base font-bold text-slate-900">For U · Hot Place</h1>
                                <p class="text-xs text-slate-400">Kor***님을 위한 추천코스</p>
                            </div>

                            <div class="space-y-4">
                                ${hotelData.map((h) => {
                                    const isLiked = wishlistState[h.id];
                                    return `
                                        <div onclick="switchPage('detail', ${h.id})" class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm scale-hover cursor-pointer relative">
                                            <div class="relative h-52 bg-slate-200">
                                                <img src="${h.img}" alt="${h.title}" class="w-full h-full object-cover">
                                                <button onclick="toggleWishlist(event, ${h.id})" class="absolute top-3 right-3 bg-black/30 backdrop-blur-sm p-2 rounded-full text-white hover:bg-rose-500 transition-colors">
                                                    <svg class="w-4 h-4 ${isLiked ? 'text-rose-500 fill-rose-500' : 'text-white'}" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                                </button>
                                                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex space-x-1.5">
                                                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                                                    <span class="w-2 h-2 rounded-full bg-white/60"></span>
                                                </div>
                                            </div>
                                            <div class="p-4">
                                                <div class="flex justify-between items-center text-xs text-slate-500 mb-1">
                                                    <span>일본 · ${h.title}</span>
                                                    <div class="flex items-center space-x-1 text-rose-500 font-bold" onclick="event.stopPropagation(); switchPage('rating');">
                                                        <span>★</span><span>${h.rating}</span>
                                                    </div>
                                                </div>
                                                <p class="text-xs text-slate-400 mb-2">${h.date}</p>
                                                <div class="flex justify-between items-center">
                                                    <span class="text-sm font-bold text-slate-900">${h.price} <span class="text-xs font-normal text-slate-400">· oneday</span></span>
                                                    <span class="text-xs text-rose-500 font-medium underline">자세히 보기</span>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;

                case 'search-results':
                    return `
                        <!-- 2. Search Results / 버튼 검색 페이지 -->
                        <div class="p-4 space-y-4 animate-fadeIn">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <div class="grid grid-cols-2 gap-2 text-center text-xs border-b border-slate-200 pb-3">
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">check in</span>
                                        <span class="font-bold text-slate-800">2023.12.02</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">check out</span>
                                        <span class="font-bold text-slate-800">2023.12.06</span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center px-2 text-xs">
                                    <span class="text-slate-500">인원수 <strong class="text-slate-800">2명</strong></span>
                                    <span class="text-rose-500 font-semibold flex items-center"><svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg> 일본</span>
                                </div>
                                <button onclick="switchPage('home')" class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-rose-500/30 hover:bg-rose-600 transition-all flex items-center justify-center space-x-2">
                                    <span>검색 결과로 돌아가기</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </button>
                            </div>

                            <h2 class="text-sm font-bold text-slate-800 mt-4">조건에 맞는 검색 결과 (4개)</h2>
                            <div class="space-y-3">
                                ${hotelData.map(h => `
                                    <div onclick="switchPage('detail', ${h.id})" class="flex items-center space-x-3 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm cursor-pointer scale-hover">
                                        <img src="${h.img}" class="w-20 h-20 rounded-xl object-cover shrink-0">
                                        <div class="flex-1">
                                            <h3 class="text-xs font-bold text-slate-800">${h.title}</h3>
                                            <p class="text-[11px] text-slate-400">${h.date}</p>
                                            <div class="flex justify-between items-center mt-2">
                                                <span class="text-xs font-extrabold text-slate-900">${h.price}</span>
                                                <span class="text-[10px] text-rose-500 font-bold bg-rose-50 px-2 py-0.5 rounded-md">예약가능</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'detail':
                    const hotel = hotelData.find(h => h.id === param) || hotelData[0];
                    return `
                        <!-- 3. Hotel Detail / 상세 보기 및 사진 클릭 페이지 -->
                        <div class="relative pb-24 animate-fadeIn">
                            <div class="relative h-72 bg-slate-900">
                                <img src="${hotel.img}" class="w-full h-full object-cover">
                                <button onclick="switchPage('home')" class="absolute top-4 left-4 bg-white/80 backdrop-blur-md p-2 rounded-full text-slate-800 shadow">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex space-x-1.5">
                                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                                    <span class="w-2 h-2 rounded-full bg-white/60"></span>
                                </div>
                            </div>
                            <div class="p-5 space-y-5">
                                <div>
                                    <div class="flex justify-between items-start">
                                        <h1 class="text-lg font-bold text-slate-900">시라카와 구마모토현 미나미오 호스텔</h1>
                                        <span onclick="switchPage('rating')" class="text-rose-500 font-bold text-sm bg-rose-50 px-2.5 py-1 rounded-lg cursor-pointer">★ ${hotel.rating}</span>
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1">일본 〒869-2402 구마모토현 Aso District, 미나미오구니마치 만간지</p>
                                    <a href="#" onclick="showToast('지도가 열립니다! 🗺️')" class="text-xs text-blue-600 font-medium inline-block mt-1 underline">지도로 보기 ▶</a>
                                </div>

                                <div class="grid grid-cols-5 gap-2 py-3 border-y border-slate-100 text-center text-[10px] text-slate-600">
                                    <div class="flex flex-col items-center"><span class="text-lg mb-1">🍽️</span>레스토랑</div>
                                    <div class="flex flex-col items-center"><span class="text-lg mb-1">📶</span>wi-fi</div>
                                    <div class="flex flex-col items-center"><span class="text-lg mb-1">🐶</span>애견동반</div>
                                    <div class="flex flex-col items-center"><span class="text-lg mb-1">🏊</span>수영장</div>
                                    <div class="flex flex-col items-center"><span class="text-lg mb-1">🛎️</span>룸서비스</div>
                                </div>

                                <div>
                                    <h3 class="text-xs font-bold text-slate-800 mb-2">객실 선택</h3>
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-700 space-y-1 mb-3">
                                        <div class="flex justify-between"><span>📅 2023.12.02 ~ 2023.12.06</span><span class="font-bold">변경</span></div>
                                        <div class="flex justify-between"><span>👤 2인</span></div>
                                    </div>
                                    
                                    <div class="space-y-2">
                                        <div class="p-3 border border-rose-200 bg-rose-50/40 rounded-xl flex justify-between items-center">
                                            <div>
                                                <h4 class="text-xs font-bold text-slate-900">2인 12인 도미토리 이층...</h4>
                                                <p class="text-[10px] text-slate-400">12월 2일 ~ 6일</p>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-xs font-extrabold text-rose-600">106,000 원</span>
                                                <span class="block text-[10px] text-rose-500 font-bold">✓ 선택됨</span>
                                            </div>
                                        </div>
                                        <div class="p-3 border border-slate-100 bg-white rounded-xl flex justify-between items-center opacity-70">
                                            <div>
                                                <h4 class="text-xs font-bold text-slate-900">디럭스 트윈 룸</h4>
                                                <p class="text-[10px] text-slate-400">12월 2일 ~ 6일</p>
                                            </div>
                                            <span class="text-xs font-extrabold text-slate-800">140,000 원</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="fixed sm:absolute bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 flex items-center justify-between z-40 shadow-lg">
                                <div>
                                    <span class="text-[10px] text-slate-400 block">총 금액</span>
                                    <span class="text-base font-bold text-slate-900">106,000 원</span>
                                </div>
                                <button onclick="showToast('🎉 성공적으로 예약 및 결제가 완료되었습니다!')" class="bg-rose-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-rose-500/30 hover:bg-rose-600 transition-all">
                                    결제 →
                                </button>
                            </div>
                        </div>
                    `;

                case 'search-input':
                    return `
                        <!-- 4. Search Input / 검색창 및 키워드 페이지 -->
                        <div class="p-4 space-y-5 animate-fadeIn">
                            <div class="flex items-center space-x-2 bg-slate-50 px-4 py-2.5 rounded-full border border-slate-200">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" placeholder="떠나고 싶은 곳은 어디인가요?" class="bg-transparent text-xs w-full focus:outline-none text-slate-800" value="시라카와">
                            </div>

                            <div>
                                <h3 class="text-xs font-bold text-slate-800 mb-2">추천 키워드</h3>
                                <div class="flex flex-wrap gap-1.5">
                                    ${['# 오션뷰', '# 차박', '# 퇴근후차크닉', '# 불멍', '# 자연과함께힐링', '# 애견동반', '# 완전노지', '# 아이들과가기좋은곳', '# 꽃구경'].map(k => `
                                        <button onclick="switchPage('search-results')" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-full text-xs text-slate-700 hover:bg-rose-50 hover:text-rose-500 transition-colors">${k}</button>
                                    `).join('')}
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-bold text-slate-800 mb-2">지역</h3>
                                <div class="grid grid-cols-4 gap-2 text-center text-xs">
