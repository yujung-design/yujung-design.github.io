<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels.com 반응형 통합 웹 & 앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        
        /* 커스텀 포인트 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ef4444; /* 포인트 레드 색상 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }

        /* 통통 튀는 바운스 및 호버 효과 */
        .bouncy-hover {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bouncy-hover:hover {
            transform: scale(1.02);
        }
        .bouncy-click:active {
            transform: scale(0.96);
        }

        /* 반응형 컨테이너 변환 (미디어 쿼리) */
        @media (min-width: 768px) {
            .app-wrapper {
                max-width: 1200px !important;
                margin: 2rem auto !important;
                border-radius: 1.5rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            }
            .desktop-grid-3 {
                display: grid !important;
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
                gap: 1.5rem;
            }
            .desktop-grid-4 {
                display: grid !important;
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6">

    <!-- 반응형 메인 프레임 -->
    <div class="app-wrapper w-full max-w-md bg-white min-h-screen md:min-h-[850px] flex flex-col justify-between relative overflow-hidden shadow-xl transition-all duration-300">
        
        <!-- 상단 네비게이션 헤더 -->
        <header class="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="switchPage('home')">
                <span class="text-red-600 font-black text-xl tracking-tighter">Hotels<span class="text-black">.com</span></span>
            </div>
            <!-- PC 웹 뷰 전용 상단 메뉴 -->
            <div class="hidden md:flex items-center space-x-4 text-sm text-gray-700 font-medium">
                <button onclick="switchPage('home')" class="hover:text-red-500 px-2 py-1">홈</button>
                <button onclick="switchPage('search-result')" class="hover:text-red-500 px-2 py-1">검색</button>
                <button onclick="switchPage('discount')" class="hover:text-red-500 px-2 py-1">할인</button>
                <button onclick="switchPage('wishlist')" class="hover:text-red-500 px-2 py-1">위시리스트</button>
                <button onclick="switchPage('account')" class="hover:text-red-500 px-2 py-1">계정</button>

        </header>

        <!-- 메인 콘텐츠 영역 (동적 렌더링) -->

            <!-- 자바스크립트로 각 페이지 내용이 동적 주입됩니다 -->
        </main>

        <!-- 하단 네비게이션 탭 바 (모바일 앱 하단 바) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center z-30 shadow-lg">
            <button onclick="switchPage('search-input')" class="nav-btn text-gray-400 hover:text-red-500 flex flex-col items-center bouncy-click" data-target="search-input">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </button>
            <button onclick="switchPage('wishlist')" class="nav-btn text-gray-400 hover:text-red-500 flex flex-col items-center bouncy-click" data-target="wishlist">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            </button>
            <button onclick="switchPage('home')" class="nav-btn text-red-500 flex flex-col items-center bouncy-click" data-target="home">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </button>
            <button onclick="switchPage('discount')" class="nav-btn text-gray-400 hover:text-red-500 flex flex-col items-center bouncy-click" data-target="discount">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
            </button>
            <button onclick="switchPage('account')" class="nav-btn text-gray-400 hover:text-red-500 flex flex-col items-center bouncy-click" data-target="account">

            { id: 2, title: "시라카와 목조 주택", location: "일본", date: "12월 2일 ~ 6일", price: "106,000", rating: "4.6", image: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80", liked: true },

        function toggleWishlist(id, event) {
            event.stopPropagation();
            const hotel = hotels.find(h => h.id === id);
            if (hotel) {
                hotel.liked = !hotel.liked;
                renderPage(currentPage);
            }
        }

        function switchPage(page) {
            currentPage = page;
            renderPage(page);
            window.scrollTo(0, 0);
        }

        function renderPage(page) {
            const container = document.getElementById('main-content');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === page) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-red-500');

                    btn.classList.remove('text-red-500');
                    btn.classList.add('text-gray-400');

            });

            switch(page) {
                case 'home':
                    container.innerHTML = `

                                </div>
                                <div class="p-4 flex justify-between items-center">
                                    <div>
                                        <span class="text-xs text-gray-500">일본 · 시라카와 오두막</span>

                                    <!-- 평점 클릭 시 후기 페이지로 이동 -->

                                </div>

                            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3">
                                <div class="grid grid-cols-2 gap-2 text-center text-sm">

                                </div>
                                <div class="grid grid-cols-2 gap-2 text-center text-sm">

                                </div>
                                <button onclick="switchPage('search-result')" class="w-full bg-red-500 text-white py-3 rounded-xl font-bold bouncy-click shadow-md hover:bg-red-600 transition flex items-center justify-center space-x-1">
                                    <span>검색</span><span>→</span>
                                </button>
                            </div>

                            <div class="flex flex-wrap justify-center gap-2 py-3 text-xs font-semibold text-gray-600">
                                <span class="px-3 py-1.5 bg-gray-100 rounded-full"># 강원</span>
                                <span class="px-3 py-1.5 bg-gray-100 rounded-full"># 애견동반</span>
                                <span class="px-3 py-1.5 bg-red-50 text-red-500 rounded-full border border-red-200"># 오션뷰</span>

                            </div>
                            <div class="desktop-grid-3 space-y-4 md:space-y-0">
                                ${hotels.map(h => `
                                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 bouncy-hover cursor-pointer" onclick="switchPage('detail')">
                                        <div class="relative h-48 bg-gray-200">
                                            <img src="${h.image}" class="w-full h-full object-cover">
                                            <button onclick="toggleWishlist(${h.id}, event)" class="absolute top-3 right-3 bg-black/40 p-2 rounded-full text-white bouncy-click">
                                                <svg class="w-4 h-4 ${h.liked ? 'text-red-500 fill-current' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                                            </button>
                                        </div>
                                        <div class="p-3">
                                            <div class="flex justify-between items-center text-xs text-gray-500 mb-1">

                                                <!-- 추천 리스트 별점 클릭 시 후기 페이지로 이동 -->

                                            </div>
                                            <p class="text-xs text-gray-400 mb-2">${h.date}</p>
                                            <span class="text-sm font-bold text-gray-900">${h.price} 원 <span class="text-xs font-normal text-gray-400">· oneday</span></span>

                case 'search-result':
                    container.innerHTML = `

                                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                        <input type="text" value="떠나고 싶은 곳은 어디인가요?" class="bg-transparent w-full text-xs text-gray-500 outline-none" readonly>
                                    </div>
                                    <span class="text-xs text-blue-600 font-medium flex items-center space-x-1 shrink-0">
                                        <span>🌐</span><span>현재위치</span>
                                    </span>
                                </div>
                            </div>

                            <div class="space-y-2">
                                <h3 class="text-xs font-bold text-gray-800">추천 키워드</h3>
                                <div class="flex flex-wrap gap-1.5 text-xs">
                                    <span class="px-3 py-1.5 bg-gray-50 border rounded-full text-gray-700"># 오션뷰</span>
                                    <span class="px-3 py-1.5 bg-gray-50 border rounded-full text-gray-700"># 차박</span>
                                    <span class="px-3 py-1.5 bg-gray-50 border rounded-full text-gray-700"># 퇴근후차크닉</span>
